name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify vendored schema matches pinned canonical
        run: python3 scripts/check_schema_pin.py

      - name: Run offline contract check and tests
        run: bash scripts/check.sh

  # Shared workflow on the locked environment: uv sync --frozen --all-extras (uv.lock, with
  # platform-backend-core pinned to a reviewed Git commit), Ruff, mypy ([tool.mypy]) and the
  # whole pytest suite, including the PostgreSQL runtime tests formerly in shared-runtime.yml,
  # under a coverage gate; then the wheel build.
  python:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      python-version: "3.12"
      postgres: true
      format-check: false # follow-up: adopt ruff format
      # Ratchet: measured 86.97% on 2026-10-24 (ADR-0004: threshold = measured, rounded down).
      coverage-threshold: "86"
      test-command: |
        PLATFORM_TEST_DSN="$DATABASE_URL" python -m pytest -q --cov --cov-report=
        uv build --wheel --out-dir dist .

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1

  lineage:
    name: Data-product lineage evidence at pinned commits (BOO-152)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: platform-data
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Public producer, lake-runtime and UI sources pinned in
      # fixtures/gates/data-product-lineage.json (tests/test_data_product_lineage.py
      # fails if these refs drift from the fixture). The private canonical
      # contract is not checked out; the checker skips only its hash comparison.
      - name: Check out bookchaowalit/data-lake-pipelines at pinned commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: bookchaowalit/data-lake-pipelines
          ref: 1178364b0c442bf8a5f6d13307a9a5e13f45cf32
          path: book-dev/github/bookchaowalit/public/book-products/data-lake-pipelines
          persist-credentials: false

      - name: Check out bookchaowalit/market-data at pinned commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: bookchaowalit/market-data
          ref: 5c2dbd9aad7a6a6e8c8dc4472b08d1ae475f208d
          path: book-dev/github/bookchaowalit/public/book-products/market-data
          persist-credentials: false

      - name: Check out bookchaowalit/travel-flight-price-data at pinned commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: bookchaowalit/travel-flight-price-data
          ref: 083293c77341915031bc0f0eeb3f86da989e911d
          path: book-dev/github/bookchaowalit/public/book-products/travel-flight-price-data
          persist-credentials: false

      - name: Check out bookchaowalit/marketing-seo-ranking-data at pinned commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: bookchaowalit/marketing-seo-ranking-data
          ref: 85aeee703162273c3604e899c0c5f898e6603b60
          path: book-dev/github/bookchaowalit/public/book-products/marketing-seo-ranking-data
          persist-credentials: false

      - name: Check out bookchaowalit/tech-ai-tools-data at pinned commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: bookchaowalit/tech-ai-tools-data
          ref: 8d557c58e3e21c3bf93049720da3c188c589d225
          path: book-dev/github/bookchaowalit/public/book-ai/tech-ai-tools-data
          persist-credentials: false

      - name: Check out bookchaowalit/market-insights-web at pinned commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: bookchaowalit/market-insights-web
          ref: cd92b36761e58b53878e0d015d04051b92c41168
          path: book-dev/github/bookchaowalit/public/book-products/market-insights-web
          persist-credentials: false

      - name: Verify every evidence line and the vendored contract at the pinned commits
        run: python3 platform-data/scripts/check_data_product_lineage.py platform-data --book-dev book-dev

  image:
    # Proves the Dockerfile builds from a clean checkout. Nothing is pushed or deployed.
    name: Container image (build only, no push)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build container image (no push)
        run: docker build --pull --tag platform-data:ci .

      - name: Image imports the service and runs as non-root
        run: |
          docker run --rm platform-data:ci python -c "import platform_backend_core, platform_data.app"
          test "$(docker run --rm platform-data:ci id -u)" != 0
