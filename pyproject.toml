[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-data"
version = "0.1.0"
description = "Workspace PostgreSQL cache, counters, search and durable quota admission"
requires-python = ">=3.12"
dependencies = ["platform-backend-core==0.1.0", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
# Lint, type check and coverage tools for CI (uv sync --frozen --all-extras).
dev = ["mypy==2.4.0", "ruff==0.17.1", "pytest-cov==7.1.0"]

[tool.uv.sources]
# Not on PyPI: lock the reviewed commit CI already installs, so the resolver can never
# pick up a same-named PyPI package (dependency confusion).
platform-backend-core = { git = "https://github.com/bookchaowalit-backend/platform-backend-core.git", rev = "88306b28228f789eecd214a11ca8a0640e9d6233" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/platform_data", "scripts"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Correctness-focused set (same as the bookchaowalit Python cells), not Ruff's broad default.
select = ["E9", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers (and the core require_scope dependency factory) in argument
# defaults are the framework's idiom.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.Body", "platform_backend_core.require_scope"]

[tool.ruff.lint.per-file-ignores]
# Pytest fixtures are shared by importing them from test_api and naming them as parameters,
# which pyflakes reads as unused/redefined imports.
"tests/runtime/*.py" = ["F401", "F811", "F841"]

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts", "tests"]
# tests import the scripts and runtime helpers (test_api) by module name; src is the package root.
mypy_path = "src:scripts:tests/runtime"
explicit_package_bases = true
check_untyped_defs = true
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# The pinned platform-backend-core commit ships no py.typed marker; analyse it anyway.
module = ["platform_backend_core", "platform_backend_core.*"]
follow_untyped_imports = true
