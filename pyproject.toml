[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-data"
version = "0.1.0"
description = "Workspace PostgreSQL cache, counters, search and durable quota admission"
requires-python = ">=3.12"
dependencies = ["platform-backend-core==0.1.0", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
